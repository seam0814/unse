<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>궁합 보기 — 두 사람 사주 궁합 점수 (달빛운세)</title>
<meta name="description" content="두 사람의 생년월일로 사주 궁합 점수와 관계 풀이를 무료로 확인하세요. 오행 관계와 일지 삼합·충으로 계산. 회원가입 없음, 결과 공유 가능.">
<link rel="canonical" href="https://seam0814.github.io/unse/gunghap/">
<link rel="stylesheet" href="../style.css">
</head>
<body>
<div class="wrap">
  <div id="site-header"></div>
  <h1>💘 궁합 보기</h1>
  <p class="sub">두 사람의 생년월일로 사주 궁합을 계산해 드려요.</p>
  <div class="tool">
    <div class="row2">
      <div class="field"><label>나 (양력 생일)</label><input id="d1" type="date"></div>
      <div class="field"><label>상대 (양력 생일)</label><input id="d2" type="date"></div>
    </div>
    <button class="btn" id="go">궁합 점수 보기</button>
    <div class="err" id="err"></div>
    <div class="result" id="result">
      <div class="score" id="score"></div>
      <div class="reading" id="reading"></div>
      <button class="btn sec share" id="share">결과 공유하기</button>
      <p class="disc">※ 재미로 보는 콘텐츠이며 실제 근거는 없습니다.</p>
    </div>
  </div>
  <div class="copy">
    <h2>궁합, 어떻게 계산하나요?</h2>
    <p>두 사람의 <b>일간(태어난 날의 천간)</b> 오행이 서로 생(生)해주는 관계면 조화가 높고, 극(剋)하는 관계면 자극·긴장이 생깁니다. 여기에 태어난 날의 지지가 삼합(잘 맞음)인지 충(부딪힘)인지를 더해 점수를 냅니다.</p>
    <details><summary>점수가 낮으면 안 맞는 건가요?</summary><p>아니에요. 낮은 점수는 '자극이 강한 관계'라는 뜻이기도 해요. 재미로만 참고하세요.</p></details>
  </div>
  <div id="site-footer"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/lunar-javascript@1.7.4/lunar.js"></script>
<script>window.SITE_ROOT="../";</script>
<script src="../common.js"></script>
<script src="../saju.js"></script>
<script>
(function(){
  var $=function(s){return document.querySelector(s)};
  var d1=$("#d1"),d2=$("#d2"),err=$("#err"),result=$("#result");
  d1.value=store.get("birth","");
  var REL={
    생조:"서로 기운을 채워주는 조합. 함께 있으면 안정되고 성장하는 관계예요.",
    설기:"한쪽이 다른 쪽을 돌보고 키워주는 조합. 헌신이 아름답지만 균형을 잊지 마세요.",
    재성:"끌어당기고 성취를 자극하는 조합. 목표를 함께하면 시너지가 큽니다.",
    관성:"긴장과 존중이 공존하는 조합. 규칙을 정하면 오히려 단단해져요.",
    비화:"닮은꼴 동료 같은 조합. 편하지만 경쟁이 될 수 있으니 역할을 나누세요."
  };
  function showErr(m){err.textContent=m;err.classList.add("show")}
  var lastScore=0;
  $("#go").addEventListener("click",function(){
    err.classList.remove("show");result.classList.remove("show");
    if(!Saju.ready()){showErr("라이브러리를 불러오지 못했어요. 새로고침 해주세요.");return}
    if(!d1.value||!d2.value){showErr("두 사람의 생일을 모두 입력하세요.");return}
    store.set("birth",d1.value);track("gunghap_view");
    try{
      var a=d1.value.split("-"),b=d2.value.split("-");
      var A=Saju.compute(+a[0],+a[1],+a[2],0,false),B=Saju.compute(+b[0],+b[1],+b[2],0,false);
      var g=Saju.gunghap(A,B);lastScore=g.score;
      $("#score").textContent=g.score+"점";
      var band=g.score>=85?"천생연분에 가까운 조합이에요! 💞":g.score>=70?"제법 잘 어울리는 조합이에요 😊":g.score>=58?"노력하면 좋아지는 조합이에요 🙂":"자극이 강한, 밀당 조합이에요 🔥";
      var rd='<h3>'+band+'</h3><p>'+(REL[g.rel]||"")+'</p>';
      if(g.note.length)rd+='<p style="color:var(--muted)">'+g.note.join(" · ")+'</p>';
      rd+='<p style="color:var(--muted)">나 '+A.dayGanKr+'('+A.dayOh+') · 상대 '+B.dayGanKr+'('+B.dayOh+')</p>';
      $("#reading").innerHTML=rd;
      result.classList.add("show");
    }catch(ex){showErr("계산 중 문제가 생겼어요. 날짜를 확인해 주세요.");console.error(ex)}
  });
  $("#share").addEventListener("click",function(){track("gunghap_share");
    var txt="우리 궁합 "+lastScore+"점! 달빛운세에서 확인해봐 ✨";var url=location.href;
    if(navigator.share){navigator.share({title:"달빛운세 궁합",text:txt,url:url}).catch(function(){})}
    else if(navigator.clipboard){navigator.clipboard.writeText(txt+" "+url);alert("결과가 복사됐어요! 붙여넣기 해보세요.")}
  });
})();
</script>
</body>
</html>
